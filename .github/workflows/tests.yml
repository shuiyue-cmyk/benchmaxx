name: Conformance tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run conformance tests
        run: python -m unittest discover -s tests -t . -v
      - name: Re-score archived snapshot
        run: |
          python -m benchmaxx --snapshot "$(ls data/snapshots/*.json | tail -1)" --out /tmp/check --no-readme
