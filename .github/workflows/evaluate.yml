name: Weekly evaluation

on:
  schedule:
    - cron: "0 2 * * 1"   # Mondays 02:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["benchmaxx/**", "tests/**"]

permissions:
  contents: write

concurrency:
  group: evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conformance tests
        run: python -m unittest discover -s tests -t . -v

      - name: Run BenchMaxx
        run: python -m benchmaxx

      - name: Commit results
        run: |
          git config user.name  "benchmaxx-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots results README.md README.zh-CN.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "results: evaluation $(date -u +%F)"
            git push
          fi
